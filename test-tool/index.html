<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VirtueStage — Model Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 20px; }
h1 { margin-bottom: 10px; font-size: 24px; }
.subtitle { color: #888; margin-bottom: 20px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #aaa; text-transform: uppercase; }
input[type="file"] { background: #222; border: 1px solid #444; padding: 8px; border-radius: 6px; color: #eee; }
textarea { background: #222; border: 1px solid #444; padding: 8px; border-radius: 6px; color: #eee; width: 400px; height: 60px; resize: vertical; font-family: inherit; }
select, button { background: #222; border: 1px solid #444; padding: 8px 16px; border-radius: 6px; color: #eee; cursor: pointer; font-size: 14px; }
button { background: #2563eb; border-color: #2563eb; font-weight: bold; }
button:hover { background: #1d4ed8; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.preview { max-width: 300px; max-height: 200px; border-radius: 6px; border: 1px solid #333; }
.results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
.result-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; max-width: 520px; }
.result-card h3 { margin-bottom: 8px; font-size: 14px; color: #aaa; }
.result-card img { max-width: 500px; border-radius: 6px; }
.result-card .meta { font-size: 12px; color: #666; margin-top: 6px; }
.status { padding: 10px; background: #1a1a1a; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 13px; color: #4ade80; }
.status.error { color: #f87171; }
.compare { display: flex; gap: 4px; margin-top: 10px; }
.compare img { max-width: 250px; border-radius: 6px; }
.compare .label { font-size: 11px; color: #888; text-align: center; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>🏠 VirtueStage Model Tester</h1>
<p class="subtitle">Upload a room photo, describe how you want it staged, pick models, compare results.</p>

<div class="controls">
  <div class="field">
    <label>Room Photo</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>
  <div class="field">
    <label>Staging Instructions</label>
    <textarea id="prompt" placeholder="Stage this room with luxury furniture. Add a sectional sofa, coffee table, area rug, wall art, and plants."></textarea>
  </div>
  <div class="field">
    <label>Models</label>
    <select id="models" multiple size="4">
      <option value="gemini-flash" selected>Gemini 2.5 Flash (free)</option>
      <option value="gemini-pro">Gemini 2.0 Pro</option>
      <option value="openai">OpenAI gpt-image-1</option>
      <option value="dalle3">OpenAI DALL-E 3</option>
    </select>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="goBtn" onclick="runTest()">🚀 Generate</button>
  </div>
</div>

<div id="previewArea"></div>
<div id="statusArea"></div>
<div id="results" class="results"></div>

<script>
const API = 'http://localhost:3100';

let uploadedFile = null;
document.getElementById('imageInput').addEventListener('change', (e) => {
  uploadedFile = e.target.files[0];
  if (uploadedFile) {
    const url = URL.createObjectURL(uploadedFile);
    document.getElementById('previewArea').innerHTML = `<img src="${url}" class="preview">`;
  }
});

async function runTest() {
  if (!uploadedFile) { alert('Upload an image first'); return; }
  
  const prompt = document.getElementById('prompt').value || 'Stage this empty room with modern furniture';
  const modelSelect = document.getElementById('models');
  const selectedModels = Array.from(modelSelect.selectedOptions).map(o => o.value);
  
  if (selectedModels.length === 0) { alert('Select at least one model'); return; }
  
  const btn = document.getElementById('goBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  
  const statusDiv = document.getElementById('statusArea');
  const resultsDiv = document.getElementById('results');
  
  statusDiv.innerHTML = '';
  
  // Run each model
  for (const model of selectedModels) {
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = `[${model}] Uploading and generating...`;
    statusDiv.appendChild(status);
    
    try {
      const formData = new FormData();
      formData.append('image', uploadedFile);
      formData.append('prompt', prompt);
      formData.append('model', model);
      
      const startTime = Date.now();
      const resp = await fetch(`${API}/api/generate`, { method: 'POST', body: formData });
      const data = await resp.json();
      
      if (data.error) {
        status.className = 'status error';
        status.textContent = `[${model}] ERROR: ${data.error}`;
        continue;
      }
      
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      status.textContent = `[${model}] ✅ Done in ${elapsed}s — ${data.cost || 'free'}`;
      
      // Add result card
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <h3>${model} — ${elapsed}s</h3>
        <div class="compare">
          <div><div class="label">BEFORE</div><img src="${URL.createObjectURL(uploadedFile)}"></div>
          <div><div class="label">AFTER</div><img src="${API}${data.resultUrl}"></div>
        </div>
        <div class="meta">Cost: ${data.cost || 'free'} | Prompt: ${prompt.substring(0, 80)}...</div>
      `;
      resultsDiv.prepend(card);
      
    } catch (err) {
      status.className = 'status error';
      status.textContent = `[${model}] FAILED: ${err.message}`;
    }
  }
  
  btn.disabled = false;
  btn.textContent = '🚀 Generate';
}
</script>
</body>
</html>
